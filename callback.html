<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TikTok OAuth Callback</title>
  <meta name="robots" content="noindex">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 760px; margin: 48px auto; padding: 0 20px; line-height: 1.6; color: #222; }
  </style>
</head>
<body>
  <h1>TikTok OAuth Callback</h1>
  <p>Forwarding authorization response to Composio...</p>
  <p>If you are not redirected automatically, <a id="forward-link" href="#">continue</a>.</p>
  <script>
    const composioCallback = 'https://backend.composio.dev/api/v3.1/toolkits/auth/callback';
    const target = composioCallback + window.location.search + window.location.hash;
    document.getElementById('forward-link').href = target;
    window.location.replace(target);
  </script>
</body>
</html>
